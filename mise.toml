# Tool pins baked into this image. Copied from the [tools] table of neinache's
# mise.toml. A bump there does not reach CI until this image is rebuilt and the
# consumer pin moves. Keep the two tables the same.
#
# sops and age stay on the same partial pins as neinache ("3", "1"). The build
# resolves them once; the binary in the image is what jobs run.

min_version = "2026.8"

[tools]
java       = "graalvm-community-25.0.2"
python     = "3.15.0"
node       = "24.21.0"
pnpm       = "12.11.2"
kubectl    = "1.37.1"
yq         = "4.54.1"
helm       = "4.3.1"
kustomize  = "5.8.3"
argocd     = "3.5.5"
sops       = "3"
age        = "1"
lychee     = "0.24"
podman     = "6.1.4"
terraform  = "1.16.6"
tflint     = "0.64.0"
trivy      = "0.76.0"
go         = "1.27.2"
bats       = "1.14.0"
shellcheck = "0.11.0"
