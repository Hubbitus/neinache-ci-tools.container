name: build-and-publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/hubbitus/bats-super
  BATS_VERSION: 1.14.0

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bats-super:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print tool versions
        run: |
          set -euo pipefail
          docker run --rm --entrypoint '' bats-super:smoke sh -c '
            jq --version; yq --version; shellcheck --version | sed -n 2p; git --version
            openssl version; sops --version; age --version; bats --version'

      - name: Verify every tool runs and bats works
        run: |
          set -euo pipefail
          docker run --rm --entrypoint '' bats-super:smoke sh -c '
            for t in jq yq shellcheck git openssl sops age bats bash; do command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }; done
            printf "@test \"ok\" {\n  run jq -n \"1+1\"\n  [ \"\$output\" = \"2\" ]\n}\n" > /tmp/t.bats
            bats /tmp/t.bats'

  build:
    runs-on: ubuntu-24.04
    needs: smoke
    permissions:
      contents: read
      id-token: write   # cosign keyless
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.BATS_VERSION }}-{{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "digest: ${DIGEST}"
          for tag in ${TAGS}; do echo "${tag}@${DIGEST}"; done

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # Docker Hub access tokens with only push scope cannot PATCH repository
      # metadata. If this step fails, update the description manually or use a
      # token/password with repository admin permission.
      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: hubbitus/bats-super
          readme-filepath: ./README.md
